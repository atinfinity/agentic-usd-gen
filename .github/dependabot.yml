# Dependabot version updates.
# Only the Python dependencies in uv.lock are covered. GitHub Actions are
# pinned through actions.lock, so they are left out here.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
