name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Zensical)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build the site
        run: uv run --only-group docs zensical build --clean
      # GitHub Pages is only available while the repository is public.
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy (GitHub Pages)
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
