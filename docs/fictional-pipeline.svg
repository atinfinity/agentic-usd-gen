<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 554" width="800" height="554" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<title id="t">架空の商品から USD アセットができるまでの処理の流れ</title>
<desc id="d">slug を渡すと、定義を読み、絵柄を描き、画像と spec.json・vision.json をキャッシュに書き、Blender で形を作って USD に書き出し、pxr で物理とマテリアルを付けて検証する。Claude も検索も使わない。</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-size:13px;font-weight:700;fill:#1F2328}
.b{font-size:13px;fill:#484F58}
.n{font-size:12px;fill:#6B6F76}
.box{fill:#FFFFFF;stroke:#DEDED9}
.dir{fill:#F0F0EC;stroke:#D0D0CA}
.ln{fill:none;stroke:#9A9A94;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dim{fill:none;stroke:#9A9A94;stroke-width:1.2}
.sh{fill:#EDEDE8;stroke:#6B6F76;stroke-width:1.5;stroke-linejoin:round}
</style>
<rect x="0.5" y="0.5" width="799" height="553" rx="14" fill="#FBFBFA" stroke="#D9D9D4"/>
<line x1="74" y1="58" x2="74" y2="508" stroke="#C9C9C3" stroke-width="2"/>
<rect x="22" y="22" width="104" height="36" rx="18" fill="#24292F"/>
<text x="74" y="45.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">slug</text>
<text x="142" y="45" font-size="13" fill="#6B6F76">例: soda_pet_500ml のような架空の商品の名前を渡す（--all ですべて）</text>
<path d="M69 80 L74 87 L79 80" class="ln"/>
<circle cx="74" cy="122" r="15" fill="#24292F"/>
<text x="74" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<line x1="89" y1="122" x2="112" y2="122" stroke="#C9C9C3" stroke-width="2"/>
<rect x="112" y="92" width="664" height="60" rx="10" fill="#FFFFFF" stroke="#DEDED9"/>
<rect x="112" y="92" width="6" height="60" rx="3" fill="#24292F"/>
<text x="134" y="117" font-size="15" font-weight="700" fill="#1F2328">定義を読む</text>
<text x="760" y="117" text-anchor="end" font-size="12" class="m" fill="#24292F">fictional/*.py</text>
<text x="134" y="138" font-size="13.5" fill="#484F58">品名・形状・寸法・色・絵柄の決まり（実在の商品名やロゴは使わない）</text>
<path d="M69 158 L74 165 L79 158" class="ln"/>
<circle cx="74" cy="200" r="15" fill="#B4530A"/>
<text x="74" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<line x1="89" y1="200" x2="112" y2="200" stroke="#C9C9C3" stroke-width="2"/>
<rect x="112" y="170" width="664" height="60" rx="10" fill="#FFFFFF" stroke="#DEDED9"/>
<rect x="112" y="170" width="6" height="60" rx="3" fill="#B4530A"/>
<text x="134" y="195" font-size="15" font-weight="700" fill="#1F2328">絵柄を描く</text>
<text x="760" y="195" text-anchor="end" font-size="12" class="m" fill="#B4530A">paint.py（Pillow）</text>
<text x="134" y="216" font-size="13.5" fill="#484F58">ラベル・箱の面・画面を描く。写真は CC0、書体は Noto Sans JP</text>
<path d="M69 236 L74 243 L79 236" class="ln"/>
<circle cx="74" cy="278" r="15" fill="#1D5FA8"/>
<text x="74" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<line x1="89" y1="278" x2="112" y2="278" stroke="#C9C9C3" stroke-width="2"/>
<rect x="112" y="248" width="664" height="60" rx="10" fill="#FFFFFF" stroke="#DEDED9"/>
<rect x="112" y="248" width="6" height="60" rx="3" fill="#1D5FA8"/>
<text x="134" y="273" font-size="15" font-weight="700" fill="#1F2328">キャッシュに書く</text>
<text x="760" y="273" text-anchor="end" font-size="12" class="m" fill="#1D5FA8">cache/fictional/&lt;品名&gt;/</text>
<text x="134" y="294" font-size="13.5" fill="#484F58">画像と spec.json・vision.json。検索して作るときの検索結果と同じ形</text>
<path d="M69 314 L74 321 L79 314" class="ln"/>
<circle cx="74" cy="356" r="15" fill="#C2410C"/>
<text x="74" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<line x1="89" y1="356" x2="112" y2="356" stroke="#C9C9C3" stroke-width="2"/>
<rect x="112" y="326" width="664" height="60" rx="10" fill="#FFFFFF" stroke="#DEDED9"/>
<rect x="112" y="326" width="6" height="60" rx="3" fill="#C2410C"/>
<text x="134" y="351" font-size="15" font-weight="700" fill="#1F2328">Blender</text>
<text x="760" y="351" text-anchor="end" font-size="12" class="m" fill="#C2410C">形状の作成</text>
<text x="134" y="372" font-size="13.5" fill="#484F58">回転体・袋・箱・部品の組み合わせを作り、USD に書き出し</text>
<path d="M69 392 L74 399 L79 392" class="ln"/>
<circle cx="74" cy="434" r="15" fill="#6B3FA0"/>
<text x="74" y="439" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<line x1="89" y1="434" x2="112" y2="434" stroke="#C9C9C3" stroke-width="2"/>
<rect x="112" y="404" width="664" height="60" rx="10" fill="#FFFFFF" stroke="#DEDED9"/>
<rect x="112" y="404" width="6" height="60" rx="3" fill="#6B3FA0"/>
<text x="134" y="429" font-size="15" font-weight="700" fill="#1F2328">pxr（OpenUSD）</text>
<text x="760" y="429" text-anchor="end" font-size="12" class="m" fill="#6B3FA0">後処理</text>
<text x="134" y="450" font-size="13.5" fill="#484F58">物理・MDL マテリアルを付け、検証してプレビューを描画</text>
<path d="M69 470 L74 477 L79 470" class="ln"/>
<rect x="22" y="488" width="130" height="36" rx="18" fill="#1A7F37"/>
<text x="87" y="511.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">USD アセット</text>
<text x="168" y="511" font-size="13" fill="#6B6F76">Claude も検索も使わないので、API キーは要らない。作ったアセットは公開できる</text>
</svg>
