<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<title id="t">部品の形（shape）</title>
<desc id="d">部品の shape は 12 種類。box は直方体、cylinder は円柱、dome は底が平らな半楕円体、pointed_dome は先のとがった山、bun は肩の張ったまんじゅう形、revolve は断面を回した形、torus はドーナツ形、prism は断面を押し出した柱、leaf は 1 枚の葉、star は放射状に裂けた面、tube は点を通る管、fruit は先が下のいちご形。</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-size:13px;font-weight:700;fill:#1F2328}
.n{font-size:12px;fill:#6B6F76}
.box{fill:#FFFFFF;stroke:#DEDED9}
.sh{fill:#EDEDE8;stroke:#6B6F76;stroke-width:1.5;stroke-linejoin:round}
.dk{fill:#DCDCD6;stroke:#6B6F76;stroke-width:1.5;stroke-linejoin:round}
.ln{fill:none;stroke:#6B6F76;stroke-width:1.2}
.ax{fill:none;stroke:#C2410C;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<rect x="0.5" y="0.5" width="799" height="329" rx="14" fill="#FBFBFA" stroke="#D9D9D4"/>
<rect x="20" y="20" width="760" height="290" rx="10" class="box"/>

<!-- row 1 -->
<g transform="translate(85 88)">
<path d="M16 -18 L28 -30 L28 10 L16 22 z" class="dk"/>
<path d="M-28 -18 L-16 -30 L28 -30 L16 -18 z" class="sh"/>
<rect x="-28" y="-18" width="44" height="40" class="sh"/>
</g>
<text x="85" y="140" text-anchor="middle" class="m h">box</text>
<text x="85" y="157" text-anchor="middle" class="n">直方体</text>

<g transform="translate(211 88)">
<path d="M-26 -22 V20 A26 8 0 0 0 26 20 V-22" class="sh"/>
<ellipse cx="0" cy="-22" rx="26" ry="8" class="dk"/>
</g>
<text x="211" y="140" text-anchor="middle" class="m h">cylinder</text>
<text x="211" y="157" text-anchor="middle" class="n">円柱</text>

<g transform="translate(337 88)">
<path d="M-32 20 A32 8 0 0 0 32 20 C32 -8 16 -24 0 -24 C-16 -24 -32 -8 -32 20 z" class="sh"/>
</g>
<text x="337" y="140" text-anchor="middle" class="m h">dome</text>
<text x="337" y="157" text-anchor="middle" class="n">半楕円体</text>

<g transform="translate(463 88)">
<path d="M-30 20 A30 8 0 0 0 30 20 C26 2 8 -12 0 -30 C-8 -12 -26 2 -30 20 z" class="sh"/>
</g>
<text x="463" y="140" text-anchor="middle" class="m h">pointed_dome</text>
<text x="463" y="157" text-anchor="middle" class="n">とがった山</text>

<g transform="translate(589 88)">
<path d="M-34 20 A34 8 0 0 0 34 20 C36 -4 24 -18 0 -18 C-24 -18 -36 -4 -34 20 z" class="sh"/>
</g>
<text x="589" y="140" text-anchor="middle" class="m h">bun</text>
<text x="589" y="157" text-anchor="middle" class="n">まんじゅう形</text>

<g transform="translate(715 88)">
<path d="M0 -34 V30" class="ax"/>
<path d="M-14 24 A14 4 0 0 0 14 24 C30 8 26 -6 10 -14 L10 -26 L-10 -26 L-10 -14 C-26 -6 -30 8 -14 24 z" class="sh"/>
<ellipse cx="0" cy="-26" rx="10" ry="3" class="dk"/>
</g>
<text x="715" y="140" text-anchor="middle" class="m h">revolve</text>
<text x="715" y="157" text-anchor="middle" class="n">断面を回す</text>

<!-- row 2 -->
<g transform="translate(85 226)">
<path d="M-36 0 A36 16 0 1 0 36 0 A36 16 0 1 0 -36 0 z M-14 -1 A14 5 0 1 1 14 -1 A14 5 0 1 1 -14 -1 z" class="sh" fill-rule="evenodd"/>
</g>
<text x="85" y="278" text-anchor="middle" class="m h">torus</text>
<text x="85" y="295" text-anchor="middle" class="n">ドーナツ形</text>

<g transform="translate(211 226)">
<path d="M0 -26 L12 -34 L38 12 L26 20 z" class="dk"/>
<path d="M-26 20 L-22 12 L-4 -22 C-2 -26 2 -26 4 -22 L22 12 L26 20 z" class="sh"/>
</g>
<text x="211" y="278" text-anchor="middle" class="m h">prism</text>
<text x="211" y="295" text-anchor="middle" class="n">断面を押し出す</text>

<g transform="translate(337 226)">
<path d="M-34 8 C-16 -18 16 -20 36 -4 C20 12 -12 20 -34 8 z" class="sh"/>
<path d="M-34 8 C-10 0 14 -4 36 -4" class="ln"/>
</g>
<text x="337" y="278" text-anchor="middle" class="m h">leaf</text>
<text x="337" y="295" text-anchor="middle" class="n">1 枚の葉</text>

<g transform="translate(463 226)">
<path d="M0 -30 L7.1 -9.7 L28.5 -9.3 L11.4 3.7 L17.6 24.3 L0 12 L-17.6 24.3 L-11.4 3.7 L-28.5 -9.3 L-7.1 -9.7 z" class="sh"/>
</g>
<text x="463" y="278" text-anchor="middle" class="m h">star</text>
<text x="463" y="295" text-anchor="middle" class="n">放射状の面</text>

<g transform="translate(589 226)">
<path d="M-32 22 C-22 -20 20 22 32 -22" fill="none" stroke="#6B6F76" stroke-width="10" stroke-linecap="round"/>
<path d="M-32 22 C-22 -20 20 22 32 -22" fill="none" stroke="#EDEDE8" stroke-width="7" stroke-linecap="round"/>
</g>
<text x="589" y="278" text-anchor="middle" class="m h">tube</text>
<text x="589" y="295" text-anchor="middle" class="n">点を通る管</text>

<g transform="translate(715 226)">
<path d="M0 28 C-20 16 -26 -6 -20 -16 C-12 -24 12 -24 20 -16 C26 -6 20 16 0 28 z" class="sh"/>
<path d="M-16 -18 L-8 -28 L-2 -20 L4 -30 L8 -20 L16 -26 L16 -16" class="ln" stroke-linejoin="round"/>
<circle cx="-8" cy="-4" r="1.3" fill="#6B6F76"/><circle cx="6" cy="-6" r="1.3" fill="#6B6F76"/><circle cx="-2" cy="8" r="1.3" fill="#6B6F76"/><circle cx="10" cy="6" r="1.3" fill="#6B6F76"/><circle cx="-10" cy="10" r="1.3" fill="#6B6F76"/>
</g>
<text x="715" y="278" text-anchor="middle" class="m h">fruit</text>
<text x="715" y="295" text-anchor="middle" class="n">いちご形</text>
</svg>
