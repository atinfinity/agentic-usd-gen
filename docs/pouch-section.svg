<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<title id="t">袋（pouch）の形</title>
<desc id="d">袋は平らなフィルムの縦（height、シール間の長さ）と横（diameter）から作る。上から見た断面は表裏 2 枚の円弧で、厚さは depth。フィルムの長さを保ったまま膨らむので、見かけの幅は平らなときより少し狭くなる。横から見ると、マチのない袋は上下のシールで厚さ 0、中央がいちばん厚い。底マチ（gusset）のある袋は底が平らな面になり、上だけがシール。</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-size:13px;font-weight:700;fill:#1F2328}
.b{font-size:12.5px;fill:#484F58}
.n{font-size:12px;fill:#6B6F76}
.box{fill:#FFFFFF;stroke:#DEDED9}
.dim{fill:none;stroke:#9A9A94;stroke-width:1.2}
.sh{fill:#EDEDE8;stroke:#6B6F76;stroke-width:1.5;stroke-linejoin:round}
.seal{fill:#D8D8D2;stroke:#6B6F76;stroke-width:1.2}
</style>
<rect x="0.5" y="0.5" width="799" height="309" rx="14" fill="#FBFBFA" stroke="#D9D9D4"/>

<rect x="20" y="20" width="240" height="270" rx="10" class="box"/>
<text x="36" y="44" class="h">① 平らなフィルム（正面）</text>
<rect x="100" y="70" width="100" height="150" rx="2" class="sh"/>
<rect x="100" y="70" width="100" height="12" class="seal"/>
<rect x="100" y="208" width="100" height="12" class="seal"/>
<text x="150" y="150" text-anchor="middle" class="n">表の画像</text>
<path d="M80 70 V220 M76 70 H84 M76 220 H84" class="dim"/>
<text x="70" y="145" text-anchor="middle" class="m n" transform="rotate(-90 70 145)">height</text>
<path d="M100 236 H200 M100 232 V240 M200 232 V240" class="dim"/>
<text x="150" y="252" text-anchor="middle" class="m n">diameter</text>
<text x="36" y="276" class="b">上下の灰色がシール</text>

<rect x="280" y="20" width="240" height="270" rx="10" class="box"/>
<text x="296" y="44" class="h">② 膨らませた断面（上から）</text>
<path d="M325 104 H475" stroke="#9A9A94" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="400" y="96" text-anchor="middle" class="n">平らなときの幅</text>
<path d="M335 160 A85.4 85.4 0 0 1 465 160 A85.4 85.4 0 0 1 335 160 z" class="sh"/>
<text x="400" y="122" text-anchor="middle" class="n">表</text>
<text x="400" y="205" text-anchor="middle" class="n">裏</text>
<path d="M490 130 V190 M486 130 H494 M486 190 H494" class="dim"/>
<text x="500" y="164" class="m n">depth</text>
<path d="M335 230 H465 M335 226 V234 M465 226 V234" class="dim"/>
<text x="400" y="248" text-anchor="middle" class="n">見かけの幅は少し狭い</text>
<text x="296" y="276" class="b">表裏 2 枚の円弧。厚さが depth</text>

<rect x="540" y="20" width="240" height="270" rx="10" class="box"/>
<text x="556" y="44" class="h">③ 横から</text>
<path d="M610 70 C634 110 634 180 610 220 C586 180 586 110 610 70 z" class="sh"/>
<path d="M610 62 V70 M610 220 V228" stroke="#6B6F76" stroke-width="3" stroke-linecap="round"/>
<text x="610" y="248" text-anchor="middle" class="n">マチなし</text>
<path d="M710 70 C734 110 736 170 724 220 H696 C684 170 686 110 710 70 z" class="sh"/>
<path d="M710 62 V70" stroke="#6B6F76" stroke-width="3" stroke-linecap="round"/>
<path d="M696 228 H724 M696 224 V232 M724 224 V232" class="dim"/>
<text x="710" y="248" text-anchor="middle" class="m n">gusset</text>
<text x="556" y="276" class="b">底マチがあると底が平らになる</text>
</svg>
