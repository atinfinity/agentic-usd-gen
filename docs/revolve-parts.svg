<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<title id="t">回転体の部品（透明な容器の断面）</title>
<desc id="d">透明なボトルを縦に切った断面。上から Cap（キャップ）、Body（容器）、容器の外側に巻いた Label（ラベル）とその内側の LabelBack（ラベルの裏面）、容器の中の Liquid（中身）。コリジョンがあるのは Body と Cap だけ。</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-size:14px;font-weight:700;fill:#1F2328}
.b{font-size:13px;fill:#484F58}
.n{font-size:12px;fill:#6B6F76}
.ld{fill:none;stroke:#9A9A94;stroke-width:1.5}
</style>
<defs>
<clipPath id="in"><path d="M159 66 L159 84 C159 113 115 113 115 151 L115 366 Q115 379 128 379 L212 379 Q225 379 225 366 L225 151 C225 113 181 113 181 84 L181 66 Z"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="799" height="429" rx="14" fill="#FBFBFA" stroke="#D9D9D4"/>

<!-- 中身（液面まで） -->
<rect x="100" y="118" width="140" height="270" fill="#C98A3A" fill-opacity="0.5" clip-path="url(#in)"/>
<line x1="60" y1="118" x2="150" y2="118" stroke="#9A9A94" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="56" y="122" text-anchor="end" class="n">液面</text>
<!-- 容器 -->
<path d="M154 66 L154 84 C154 110 110 110 110 150 L110 368 Q110 384 126 384 L214 384 Q230 384 230 368 L230 150 C230 110 186 110 186 84 L186 66" fill="none" stroke="#1D5FA8" stroke-width="3" stroke-linejoin="round"/>
<!-- ラベル（外側に巻く）と裏面 -->
<rect x="110" y="190" width="120" height="120" fill="#2F7D4F" fill-opacity="0.10"/>
<rect x="102" y="190" width="6" height="120" fill="#2F7D4F"/>
<rect x="232" y="190" width="6" height="120" fill="#2F7D4F"/>
<line x1="109.500" y1="190" x2="109.500" y2="310" stroke="#E0A800" stroke-width="2"/>
<line x1="230.500" y1="190" x2="230.500" y2="310" stroke="#E0A800" stroke-width="2"/>
<!-- キャップ -->
<rect x="147" y="38" width="46" height="30" rx="4" fill="#B4530A"/>
<!-- 回転の軸 -->
<line x1="170" y1="22" x2="170" y2="402" stroke="#C9C9C3" stroke-width="1" stroke-dasharray="8 4 2 4"/>
<text x="170" y="418" text-anchor="middle" class="n">回転の軸（Z）</text>

<path d="M193 52 H296" class="ld"/>
<circle cx="302" cy="52" r="5" fill="#B4530A"/>
<text x="316" y="57" class="m h">Cap</text>
<text x="776" y="57" text-anchor="end" class="n" style="fill:#1F2328;font-weight:700">コリジョンあり</text>
<text x="316" y="77" class="b">キャップ・蓋。色は colors.cap（上面に画像も貼れる）</text>

<path d="M231 160 L296 134" class="ld"/>
<circle cx="302" cy="132" r="5" fill="#1D5FA8"/>
<text x="316" y="137" class="m h">Body</text>
<text x="776" y="137" text-anchor="end" class="n" style="fill:#1F2328;font-weight:700">コリジョンあり</text>
<text x="316" y="157" class="b">容器。透け方（透明・半透明・不透明）で作り分ける</text>

<path d="M238 212 H296" class="ld"/>
<circle cx="302" cy="212" r="5" fill="#2F7D4F"/>
<text x="316" y="217" class="m h">Label</text>
<text x="776" y="217" text-anchor="end" class="n">見た目だけ</text>
<text x="316" y="237" class="b">ラベル。展開したテクスチャ textures/label.png を貼る</text>

<path d="M231 292 H296" class="ld"/>
<circle cx="302" cy="292" r="5" fill="#E0A800"/>
<text x="316" y="297" class="m h">LabelBack</text>
<text x="776" y="297" text-anchor="end" class="n">見た目だけ</text>
<text x="316" y="317" class="b">ラベルの裏面。透明・半透明の容器だけ（絵柄が鏡写しに透けない）</text>

<path d="M200 352 L262 352 L296 372" class="ld"/>
<circle cx="302" cy="372" r="5" fill="#C98A3A"/>
<text x="316" y="377" class="m h">Liquid</text>
<text x="776" y="377" text-anchor="end" class="n">見た目だけ</text>
<text x="316" y="397" class="b">中身。透明・半透明の容器だけ、液面の高さまで</text>
</svg>
