<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" width="800" height="344" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<title id="t">4 つの形状（shape_class）</title>
<desc id="d">revolve は回転体（ボトル・瓶・缶・カップ）で高さと直径、pouch は袋でシール間の長さ・幅・厚さ、box は箱で高さ・正面の横幅・奥行き、assembly は部品の組み合わせ（什器・内装）で parts に部品を並べる。</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.h{font-size:13px;font-weight:700;fill:#1F2328}
.b{font-size:13px;fill:#484F58}
.n{font-size:12px;fill:#6B6F76}
.box{fill:#FFFFFF;stroke:#DEDED9}
.dir{fill:#F0F0EC;stroke:#D0D0CA}
.ln{fill:none;stroke:#9A9A94;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dim{fill:none;stroke:#9A9A94;stroke-width:1.2}
.sh{fill:#EDEDE8;stroke:#6B6F76;stroke-width:1.5;stroke-linejoin:round}
</style>
<rect x="0.5" y="0.5" width="799" height="343" rx="14" fill="#FBFBFA" stroke="#D9D9D4"/>
<rect x="20" y="24" width="182" height="296" rx="10" class="box"/><rect x="20" y="24" width="6" height="296" rx="3" fill="#1D5FA8"/>
