[project]
name = "agentic-usd-gen"
version = "0.2.0"
description = "商品名から画像・寸法を検索し、Blender で3Dモデル化して Isaac Sim 向け USD を書き出す"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "atinfinity", email = "dandelion1124@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "materialx>=1.39.5",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "usd-core>=26.8",
]

[project.urls]
Repository = "https://github.com/atinfinity/agentic-usd-gen"
Issues = "https://github.com/atinfinity/agentic-usd-gen/issues"

[project.optional-dependencies]
# SimReady Foundation の検証（agentic-usd-gen-simready）
simready = [
    "simready-validate>=2026.8.0",
    "simready-foundation-tier-core>=2026.8.0",
]

[project.scripts]
agentic-usd-gen = "agentic_usd_gen.cli:main"
agentic-usd-gen-export = "agentic_usd_gen.catalog:main"
agentic-usd-gen-dedupe-textures = "agentic_usd_gen.texdedupe:main"
agentic-usd-gen-fictional = "agentic_usd_gen.fictional:main"
agentic-usd-gen-simready = "agentic_usd_gen.simready:main"
agentic-usd-gen-visual = "agentic_usd_gen.visual_check:main"
agentic-usd-gen-droptest = "agentic_usd_gen.drop_test:main"
agentic-usd-gen-jointtest = "agentic_usd_gen.joint_test:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "zensical>=0.1.1",
    "markdown-callouts>=0.4",
]

# CI runs `uv run --with ruff==0.17.6 ruff check .`; keep the version there in step.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's default rule selection, minus the rules that are a matter of style here.
ignore = [
    "C408",     # dict(a=1, b=2) instead of a literal: keyword calls read well for parameter sets
    "PLW1510",  # subprocess.run without check=: the callers inspect returncode themselves
    "RUF007",   # zip(a, a[1:]) instead of itertools.pairwise(): both are clear
    "RUF046",   # int(round(x)): the explicit int() states the intent
    "SIM905",   # """...""".split(): long word lists are easier to edit as one string
    "UP031",    # printf-style "%02X" formatting: fine for hex colour strings
]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses, safe as default arguments (B008).
extend-immutable-calls = ["agentic_usd_gen.drop_test.Limits", "agentic_usd_gen.joint_test.Limits"]
